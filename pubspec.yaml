name: aud_audio_vst3
description: "VST3 shell of the Audanika Audio Engine over its headless host"
version: 0.5.0
publish_to: none
homepage: https://github.com/audaudio/aud_audio_vst3
repository: https://github.com/audaudio/aud_audio_vst3

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.2.0
  aud_audio_plugin:
    git:
      url: git@github.com:audaudio/aud_audio_plugin.git
      tag_pattern: "{{version}}"
    version: ^0.1.1
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.6.0
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.6.0
dev_dependencies:
  dna_audanika: ^0.1.0
  flutter_lints: ^6.0.0
  helix: ^1.14.0
  test: ^1.33.0