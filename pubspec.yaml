name: aud_audio_vst3
description: "VST3 shell of the Audanika Audio Engine over its headless host"
version: 0.1.0
publish_to: none
homepage: https://github.com/audaudio/aud_audio_vst3
repository: https://github.com/audaudio/aud_audio_vst3

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.2.0
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.5.2
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.5.3

dev_dependencies:
  dna_audanika: ^0.0.2
  flutter_lints: ^6.0.0
  helix: ^1.13.0
  test: ^1.33.0
