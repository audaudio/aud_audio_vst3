name: aud_audio_vst3
description: "VST3 shell of the Audanika Audio Engine over its headless host"
version: 0.0.1
publish_to: none
homepage: https://github.com/audaudio/aud_audio_vst3
repository: https://github.com/audaudio/aud_audio_vst3

environment:
  sdk: ^3.12.2

dependencies:
  aud_audio_graph:
    git:
      url: https://github.com/audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.0.1
  code_assets: ^1.1.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  dna_audanika: ^0.0.2
  ffi: ^2.1.4
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  helix: ^1.11.0
  test: ^1.28.0
